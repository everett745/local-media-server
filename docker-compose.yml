name: lms

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: lms-jellyfin
    ports:
      - "8096:8096"
    environment:
      TZ: ${TZ}
    volumes:
      - ${BASE_PATH}/jellyfin/config:/config
      - ${BASE_PATH}/jellyfin/cache:/cache
      - ${MEDIA_SHARE}/media:/media          # локальные /data/media
      - ${MEDIA_SHARE_USB}:/usb              # ← USB диск добавлен
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8096"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  seerr:
    image: seerr/seerr:latest
    container_name: lms-seerr
    ports:
      - "5055:5055"
    environment:
      TZ: ${TZ}
      PUID: ${SEERR_PUID}
      PGID: ${SEERR_PGID}
    volumes:
      - ${BASE_PATH}/seerr:/app/config
      - ${MEDIA_SHARE}:/data                  # локальный ./data
      - ${MEDIA_SHARE_USB}:/usb               # ← USB диск добавлен
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5055/api/v1/status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: lms-radarr
    environment:
      TZ: ${TZ}
      PUID: ${MEDIA_PUID}
      PGID: ${MEDIA_PGID}
    ports:
      - "7878:7878"
    volumes:
      - ${BASE_PATH}/radarr/config:/config
      - ${MEDIA_SHARE}:/data                  # локальный ./data
      - ${MEDIA_SHARE_USB}:/usb               # ← USB диск добавлен
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: lms-sonarr
    environment:
      TZ: ${TZ}
      PUID: ${MEDIA_PUID}
      PGID: ${MEDIA_PGID}
    ports:
      - "8989:8989"
    volumes:
      - ${BASE_PATH}/sonarr/config:/config
      - ${MEDIA_SHARE}:/data                  # локальный ./data
      - ${MEDIA_SHARE_USB}:/usb               # ← USB диск добавлен
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: lms-prowlarr
    environment:
      TZ: ${TZ}
      PUID: ${MEDIA_PUID}
      PGID: ${MEDIA_PGID}
    ports:
      - "9696:9696"
    volumes:
      - ${BASE_PATH}/prowlarr/config:/config
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: lms-qbittorrent
    environment:
      TZ: ${TZ}
      PUID: ${MEDIA_PUID}
      PGID: ${MEDIA_PGID}
      WEBUI_PORT: 8080
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ${BASE_PATH}/qbittorrent/config:/config
      - ${MEDIA_SHARE}:/data                  # локальный ./data
      - ${MEDIA_SHARE_USB}:/usb               # ← USB диск добавлен
    restart: unless-stopped
